name: Mirroring

on: [push, delete]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Push mirror
        env:
          SRC: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          DST: https://x-access-token:${{ secrets.MIRROR_TOKEN }}@github.com/Epitech2026-2027/I-DEV-700-INT-7-1-timemanager-24.git
        run: |
          git clone --mirror "$SRC" repo.git
          cd repo.git
          git push --prune "$DST" \
            "+refs/heads/*:refs/heads/*" \
            "+refs/tags/*:refs/tags/*"
