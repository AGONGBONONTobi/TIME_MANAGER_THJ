name: Mirroring

on: [push, delete]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Push mirror
        id: mirror
        uses: bridgelightcloud/github-mirror-action@v1
        with:
          origin: https://github.com/Epitech2026-2027/I-DEV-700-INT-7-1-timemanager-24
          GITHUB_TOKEN: ${{secrets.MIRROR_TOKEN}}
