language: minimal

services:
  - docker

env:
  global:
    - DOCKER_API_IMAGE=$DOCKER_USER/time-manager-api
    - DOCKER_FRONT_IMAGE=$DOCKER_USER/time-manager-front
    - VM_USER=tobiagongbonon
    - VM_IP=35.192.87.173
    - DEPLOY_PATH=/home/tobiagongbonon/TIME_MANAGER_THJ

stages:
  - name: test
  - name: build & push images
    if: type = push AND branch = main
  - name: deploy
    if: type = push AND branch = main

jobs:
  include:

    # ─── Test : backend (Elixir) ───────────────────────────────
    - stage: test
      name: "Test - Backend (Elixir)"
      language: minimal
      services:
        - docker
      script:
        - docker network create tm
        - docker run -d --name pg --network tm -e POSTGRES_PASSWORD=postgres postgres:16
        - until docker exec pg pg_isready -U postgres; do sleep 1; done
        - |
          docker run --rm --network tm \
            -e MIX_ENV=test -e DB_HOST=pg \
            -v "$PWD/time_manager":/app -w /app \
            elixir:1.16 \
            sh -c "mix local.hex --force && mix local.rebar --force && mix deps.get && mix test"

    # ─── Test : frontend (Vue.js) ──────────────────────────────
    - stage: test
      name: "Test - Frontend (Vue.js)"
      language: node_js
      node_js: "22"
      env:
        - CI=true
      script:
        - cd frontend
        - npm install
        - npm test


    - stage: build & push images
      name: "Build & Push Docker images"
      language: minimal
      services:
        - docker
      script:
        # Login Docker Hub
        - echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin

        # Backend
        - docker build -t $DOCKER_API_IMAGE:$TRAVIS_COMMIT ./time_manager
        - docker tag $DOCKER_API_IMAGE:$TRAVIS_COMMIT $DOCKER_API_IMAGE:latest
        - docker push $DOCKER_API_IMAGE:$TRAVIS_COMMIT
        - docker push $DOCKER_API_IMAGE:latest

        # Frontend
        - docker build -t $DOCKER_FRONT_IMAGE:$TRAVIS_COMMIT ./frontend
        - docker tag $DOCKER_FRONT_IMAGE:$TRAVIS_COMMIT $DOCKER_FRONT_IMAGE:latest
        - docker push $DOCKER_FRONT_IMAGE:$TRAVIS_COMMIT
        - docker push $DOCKER_FRONT_IMAGE:latest

    - stage: deploy
      name: "Deploy to VM"
      language: minimal
      before_script:
        - echo "$SSH_KEY_BASE64" | base64 -d > /tmp/deploy_key
        - chmod 600 /tmp/deploy_key
      script:
        - scp -P 2222 -i /tmp/deploy_key -o StrictHostKeyChecking=no docker-compose.yml $VM_USER@$VM_IP:$DEPLOY_PATH/
        - ssh -p 2222 -i /tmp/deploy_key -o StrictHostKeyChecking=no $VM_USER@$VM_IP "
