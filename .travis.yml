language: minimal

services:
  - docker

env:
  global:
    - DOCKER_API_IMAGE=$DOCKER_USER/time-manager-api
    - DOCKER_FRONT_IMAGE=$DOCKER_USER/time-manager-front
    - VM_USER=tobiagongbonon
    - VM_IP=35.192.87.173
    - DEPLOY_PATH=/home/tobiagongbonon/TIME_MANAGER_THJ

stages:
  - name: test
  - name: build & push images
    if: branch = main
  - name: deploy
    if: branch = main

jobs:
  include:
    # ─── Test stage: backend ───────────────────────────────────
    - stage: test
      name: backend
      language: minimal
      services:
        - docker
      script:
        - docker run --rm
            -v "$PWD/time_manager":/app
            -w /app
            -e MIX_ENV=test
            -e SECRET_KEY_BASE=ci_secret_key_base_padding_padding_padding_padding_padding_padding
            elixir:1.20-otp-27
            bash -c "mix local.hex --force && mix local.rebar --force && mix deps.get && mix test"
    # - stage: test
    #   name: backend
    #   language: elixir
    #   elixir: '1.20'
    #   otp_release: '27'
    #   services:
    #     - postgresql
    #   env:
    #     - MIX_ENV=test
    #     - DATABASE_URL=ecto://postgres@localhost/time_manager_test
    #     - SECRET_KEY_BASE=postgres
    #   before_script:
    #     - psql -c 'CREATE DATABASE time_manager_test;' -U postgres
    #   script:
    #     - cd time_manager
    #     - mix local.hex --force
    #     - mix local.rebar --force
    #     - mix deps.get
    #     - mix ecto.create --quiet || true
    #     - mix ecto.migrate
    #     - mix test

    # ─── Test stage: frontend ──────────────────────────────────
    - stage: test
      name: frontend
      language: node_js
      node_js: '22'
      script:
        - cd frontend
        - npm ci
        - npm test

    # ─── Build & push (main only) ──────────────────────────────
    - stage: build & push images
      script:
        - echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
        - docker build -t $DOCKER_API_IMAGE:$TRAVIS_COMMIT ./time_manager
        - docker tag $DOCKER_API_IMAGE:$TRAVIS_COMMIT $DOCKER_API_IMAGE:latest
        - docker push $DOCKER_API_IMAGE:$TRAVIS_COMMIT
        - docker push $DOCKER_API_IMAGE:latest
        - docker build -t $DOCKER_FRONT_IMAGE:$TRAVIS_COMMIT ./frontend
        - docker tag $DOCKER_FRONT_IMAGE:$TRAVIS_COMMIT $DOCKER_FRONT_IMAGE:latest
        - docker push $DOCKER_FRONT_IMAGE:$TRAVIS_COMMIT
        - docker push $DOCKER_FRONT_IMAGE:latest

    # ─── Deploy (main only) ────────────────────────────────────
    - stage: deploy
      before_script:
        - echo "$SSH_KEY_BASE64" | base64 -d > /tmp/deploy_key
        - chmod 600 /tmp/deploy_key
      script:
        - scp -i /tmp/deploy_key -o StrictHostKeyChecking=no docker-compose.yml $VM_USER@$VM_IP:$DEPLOY_PATH/
        - ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no $VM_USER@$VM_IP "
            cd $DEPLOY_PATH &&
            DOCKER_USER=$DOCKER_USER docker compose pull &&
            DOCKER_USER=$DOCKER_USER docker compose up -d
          "
