services:
  db:
    image: postgres:16
    container_name: time_manager_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: time_manager_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d time_manager_prod"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./time_manager
    container_name: time_manager_backend
    environment:
      DATABASE_URL: ecto://postgres:postgres@db/time_manager_prod
      SECRET_KEY_BASE: jo7b6C3dJWk6Kte7Exmiq3xyaCrEWLZOJODbDtYq+IdHcXRt4XV6+5bDgt6J91nA
      PHX_HOST: localhost
      PORT: 4000
      PHX_SERVER: "true"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: