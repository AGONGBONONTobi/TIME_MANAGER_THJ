<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1d2430">
    <meta name="description" content="Time Manager — suivi accessible des horaires de travail.">
    <title>Time Manager</title>
    <style>
      #startup-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: none;
        place-items: end start;
        box-sizing: border-box;
        padding: max(48px, env(safe-area-inset-top)) 32px max(64px, env(safe-area-inset-bottom));
        color: #fff;
        background:
          linear-gradient(180deg, rgba(9, 18, 31, 0.06) 20%, rgba(9, 18, 31, 0.88) 100%),
          url('/gotham-city.jpg') center / cover no-repeat,
          #111827;
        font-family: system-ui, sans-serif;
        opacity: 1;
        transition: opacity 350ms ease;
      }

      #startup-splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      #startup-splash p,
      #startup-splash h1 {
        margin: 0;
      }

      #startup-splash p {
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.2em;
      }

      #startup-splash h1 {
        margin-top: 8px;
        font-size: clamp(2.5rem, 12vw, 4rem);
        font-weight: 800;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <div id="startup-splash" role="img" aria-label="Gotham au lever du jour">
      <div>
        <p>TIME MANAGER</p>
        <h1>GOTHAM</h1>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
