<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1d2430">
    <meta name="description" content="Time Manager — suivi accessible des horaires de travail.">
    <title>Time Manager</title>
    <style>
      #startup-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: none;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        box-sizing: border-box;
        padding: max(32px, env(safe-area-inset-top)) 20px max(44px, env(safe-area-inset-bottom));
        color: #ffffff;
        background:
          linear-gradient(180deg, rgba(8, 12, 20, 0.12) 0%, rgba(8, 12, 20, 0.28) 45%, rgba(6, 10, 16, 0.9) 100%),
          url('/bat-splash.jpg') center center / cover no-repeat,
          #0b0f19;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.4s ease, visibility 0.4s ease;
        user-select: none;
        -webkit-user-select: none;
      }

      body.is-mobile-app #startup-splash {
        display: flex;
      }

      @media (max-width: 768px) {
        #startup-splash {
          display: flex;
        }
      }

      #startup-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .splash-bottom-bar {
        width: 100%;
        max-width: 290px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 10px;
        padding: 16px 20px 18px;
        background: rgba(9, 13, 22, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 20px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
      }

      .splash-brand-text {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
      }

      .splash-badge {
        margin: 0;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #facc15;
        text-shadow: 0 0 10px rgba(250, 204, 21, 0.45);
      }

      .splash-app-title {
        margin: 0;
        font-size: clamp(1.3rem, 5vw, 1.7rem);
        font-weight: 800;
        letter-spacing: 0.12em;
        color: #f8fafc;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      }

      .splash-progress-track {
        width: 100%;
        max-width: 230px;
        height: 5px;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        margin-top: 4px;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
      }

      .splash-progress-fill {
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: linear-gradient(90deg, #ca8a04 0%, #facc15 60%, #fef08a 100%);
        box-shadow: 0 0 12px rgba(250, 204, 21, 0.7);
        animation: splash-loading-progress 2.6s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
      }

      @keyframes splash-loading-progress {
        0% {
          width: 0%;
        }
        30% {
          width: 38%;
        }
        70% {
          width: 82%;
        }
        100% {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="startup-splash" role="dialog" aria-modal="true" aria-label="Écran de chargement Time Manager">
      <div class="splash-bottom-bar">
        <div class="splash-brand-text">
          <span class="splash-badge">GOTHAM CITY</span>
          <h1 class="splash-app-title">TIME MANAGER</h1>
        </div>
        <div class="splash-progress-track" role="progressbar" aria-label="Chargement de l'application" aria-valuemin="0" aria-valuemax="100">
          <div class="splash-progress-fill"></div>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
