services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data

  phoenix:
    image: ${DOCKER_IMAGE:-hello-phoenix}:latest   # ← image du registry
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "4000:4000"
    restart: unless-stopped

volumes:
  pgdata: